pipeline:
  name: Environment Release Sync
  identifier: environment_release_sync
  orgIdentifier: jpbartocoderio
  projectIdentifier: environments
  tags: {}
  description: Triggered by pushes to main. Detects which environment repositories had a release version change and echoes the deployment pipeline that would be executed for each affected repository.
  stages:
    - stage:
        name: Detect and Dispatch
        identifier: detect_and_dispatch
        description: Detect repository release changes across all environments and echo the deployment pipeline details that would be triggered for each changed repository.
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Clone Repository
                  identifier: clone_repository
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          # Clone harness-env at the commit that triggered this pipeline.
                          # depth=2 ensures HEAD~1 is available for the release-change diff
                          # performed by detect_release_changes.py.
                          mkdir -p /harness/workspace
                          git clone --depth 2 \
                            https://x-access-token:<+secrets.getValue("account.jpbarto-github-token")>@github.com/jpbarto/harness-env.git \
                            /harness/workspace
                          cd /harness/workspace
                          git checkout <+trigger.commitSha>
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: Detect Release Changes
                  identifier: detect_release_changes
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          cd /harness/workspace
                          pip3 install --quiet pyyaml
                          python3 scripts/detect_release_changes.py > /harness/changed_repos.json
                          echo "=== Changed repository releases ==="
                          cat /harness/changed_repos.json
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: Echo Deployment Dispatches
                  identifier: echo_deployment_dispatches
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          cd /harness/workspace
                          pip3 install --quiet pyyaml
                          python3 scripts/echo_deployment_dispatches.py
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
  delegateSelectors:
    - jpbarto-aws-vpoc-delegate-us-east-1
